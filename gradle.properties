# The app and instrumentation sources are substantial; keep compilation in one
# bounded JVM so a 2 GiB local/CI worker does not run a separate 4 GiB Kotlin
# daemon alongside Gradle. A single worker trades some throughput for a stable
# memory ceiling; the clean debug build was verified with these limits.
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
